name: Deploy AWS Lambda

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository Code
      uses: actions/checkout@v3

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' 

    - name: 📦 Install Dependencies and Create Zip
      run: |
        # Navigate into your lambda folder
        cd lambda_function
        
        # Force-install the AWS Linux-compatible binaries just like we did locally
        pip install --platform manylinux2014_x86_64 --target=. --implementation cp --python-version 3.10 --only-binary=:all: --upgrade Pillow ExifRead
        
        # Zip all contents (the code + the new libraries)
        zip -r ../deployment.zip .

    - name: 🔐 Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-north-1 

    - name: 🚀 Deploy to AWS Lambda
      run: |
        # Use the AWS CLI to overwrite the old code with the new zip
        aws lambda update-function-code \
          --function-name ImageProcessor \
          --zip-file fileb://deployment.zip