name: CI/CD Pipeline

on:
  push:
    branches:
      - main 

jobs:
  
  test:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout Repository Code
      uses: actions/checkout@v3

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' 

    - name: 📦 Install Test Dependencies
      run: |
        pip install pytest moto[s3,dynamodb] boto3 Pillow exifread

    - name: 🧪 Run Pytest with Moto
      run: |
        cd "lambda function"
        pytest test.py


  build-and-deploy:
    needs: test 
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout Repository Code
      uses: actions/checkout@v3

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' 

    - name: 📦 Install Dependencies and Create Zip
      run: |
        cd lambda_function
        pip install --platform manylinux2014_x86_64 --target=. --implementation cp --python-version 3.10 --only-binary=:all: --upgrade Pillow ExifRead
        zip -r ../deployment.zip .

    - name: 🔐 Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-north-1

    - name: 🚀 Deploy to AWS Lambda
      run: |
        aws lambda update-function-code \
          --function-name ImageProcessor \
          --zip-file fileb://deployment.zip